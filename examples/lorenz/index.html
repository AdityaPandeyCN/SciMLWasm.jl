<!doctype html>
<meta charset="utf-8">
<title>SciMLWasm — Lorenz in the browser</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; color: #222; background: #fafafa; }
  pre { background: #fff; border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
  canvas { background: #fff; border: 1px solid #ddd; display: block; }
  .ctl { display: grid; grid-template-columns: 8em 1fr 8em; gap: 6px 12px; max-width: 720px; align-items: center; }
  .ctl input[type=range] { width: 100%; }
</style>
<h2>Lorenz / SimpleTsit5, solved in WebAssembly</h2>
<div class="ctl">
  <label for="sig">σ</label><input id="sig" type="range" min="0" max="30" step="0.1" value="10"><span id="sigv"></span>
  <label for="rho">ρ</label><input id="rho" type="range" min="0" max="60" step="0.1" value="28"><span id="rhov"></span>
  <label for="beta">β</label><input id="beta" type="range" min="0.1" max="10" step="0.01" value="2.6667"><span id="betav"></span>
  <label for="tend">t_end</label><input id="tend" type="range" min="1" max="100" step="1" value="20"><span id="tendv"></span>
</div>
<pre id="out">loading lorenz.wasm…</pre>
<canvas id="c" width="720" height="480"></canvas>
<script type="module">
const out = document.getElementById("out");
const $ = (id) => document.getElementById(id);
try {
  const bytes = await fetch("lorenz.wasm").then((r) => r.arrayBuffer());
  const t0 = performance.now();
  const module = await WebAssembly.compile(bytes, { builtins: ["js-string"] });
  const imports = {};
  for (const { module: m, name, kind } of WebAssembly.Module.imports(module)) {
    if (m.startsWith("wasm:")) continue;
    (imports[m] ??= {})[name] = kind === "function" ? () => {} : undefined;
  }
  const { exports: ex } = await WebAssembly.instantiate(module, imports);
  const loadMs = (performance.now() - t0).toFixed(1);

  const solve = () => {
    const s = +$("sig").value, r = +$("rho").value, b = +$("beta").value, tend = +$("tend").value;
    $("sigv").textContent = s; $("rhov").textContent = r; $("betav").textContent = b; $("tendv").textContent = tend;
    const t1 = performance.now();
    const sol = ex.solve_lorenz(s, r, b, 0.01, tend);
    const ms = (performance.now() - t1).toFixed(1);
    const n = ex.vlen(sol);
    out.textContent =
      `lorenz.wasm: ${bytes.byteLength} bytes, compiled+instantiated in ${loadMs} ms\n` +
      `solve_lorenz(${s}, ${r}, ${b}, 0.01, ${tend}) in ${ms} ms — ${n / 3} timesteps\n` +
      `final u = [${ex.vget(sol, n - 2)}, ${ex.vget(sol, n - 1)}, ${ex.vget(sol, n)}]`;
    const c = $("c"), g = c.getContext("2d");
    g.clearRect(0, 0, c.width, c.height);
    const pts = [];
    for (let i = 1; i <= n; i += 3) pts.push([ex.vget(sol, i), ex.vget(sol, i + 2)]);
    const xs = pts.map((p) => p[0]), zs = pts.map((p) => p[1]);
    const xmin = Math.min(...xs), xmax = Math.max(...xs), zmin = Math.min(...zs), zmax = Math.max(...zs);
    const sx = (x) => 20 + ((x - xmin) / (xmax - xmin || 1)) * (c.width - 40);
    const sz = (z) => c.height - 20 - ((z - zmin) / (zmax - zmin || 1)) * (c.height - 40);
    g.strokeStyle = "#1f5fbf"; g.lineWidth = 1; g.beginPath();
    pts.forEach(([x, z], i) => (i ? g.lineTo(sx(x), sz(z)) : g.moveTo(sx(x), sz(z))));
    g.stroke();
  };
  for (const id of ["sig", "rho", "beta", "tend"]) $(id).addEventListener("input", solve);
  solve();
} catch (e) {
  out.textContent = "ERROR: " + (e && e.stack || e);
}
</script>
